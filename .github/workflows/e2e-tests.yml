name: E2E Tests (IMCOARCA)

# Run the Playwright UI suite and the Bruno API suite on every push and
# pull request targeting main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Working directory for the test project.
  SUITE_DIR: tests/e2e-proyecto-final

jobs:
  playwright:
    name: Playwright UI tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tests/e2e-proyecto-final
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tests/e2e-proyecto-final/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Create .env from secrets
        # Both playwright.config.js and global-setup.js load the repo-root .env
        # via dotenv. Credentials are injected from GitHub secrets, with
        # sensible fallbacks so the workflow still runs if a secret is unset.
        working-directory: ${{ github.workspace }}
        run: |
          cat > .env <<EOF
          IMCOARCA_BASE_URL=${{ secrets.IMCOARCA_BASE_URL || 'https://imcoarca.leonardojose.dev' }}
          IMCOARCA_USER=${{ secrets.IMCOARCA_USER }}
          IMCOARCA_PASS=${{ secrets.IMCOARCA_PASS }}
          IMCOARCA_VENDEDOR_USER=${{ secrets.IMCOARCA_VENDEDOR_USER }}
          IMCOARCA_VENDEDOR_PASS=${{ secrets.IMCOARCA_VENDEDOR_PASS }}
          IMCOARCA_ALLOW_WRITES=0
          EOF

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e-proyecto-final/playwright-report/
          retention-days: 14

  bruno:
    name: Bruno API tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tests/e2e-proyecto-final/bruno
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Bruno CLI
        run: npm install -g @usebruno/cli

      - name: Run Bruno API tests (admin - imcoarca env)
        run: bru run "01 - Auth" "02 - Clientes" "03 - Articulos" --env imcoarca

      - name: Run Bruno API tests (vendedor role - vendedor env)
        run: bru run "04 - Rol Vendedor" --env vendedor
