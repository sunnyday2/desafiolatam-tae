name: CI Playwright/Bruno Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  bruno-tests:
    name: Bruno backend API tests
    runs-on: ubuntu-latest
    environment: BRUNO_TEST
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Install Bruno CLI
        run: npm install -g @usebruno/cli

      - name: Load Secrets and Run Bruno Tests
        env:
          RAW_ENV_ADMIN: ${{ secrets.ENV_ADMIN }}
        run: |
          # 1. Extraer todas las variables requeridas desde el JSON de secretos
          ADMIN_USER=$(echo "$RAW_ENV_ADMIN" | jq -r '.ADMIN_USER // empty')
          ADMIN_PASS=$(echo "$RAW_ENV_ADMIN" | jq -r '.ADMIN_PASS // empty')
          BACKEND_BASE_URL=$(echo "$RAW_ENV_ADMIN" | jq -r '.BACKEND_BASE_URL // empty')
          ADMIN_LINE_ID=$(echo "$RAW_ENV_ADMIN" | jq -r '.ADMIN_LINE_ID // empty')
          ADMIN_CATEGORY_ID=$(echo "$RAW_ENV_ADMIN" | jq -r '.ADMIN_CATEGORY_ID // empty')
          VENDEDOR_USER=$(echo "$RAW_ENV_ADMIN" | jq -r '.VENDEDOR_USER // empty')
          VENDEDOR_PASS=$(echo "$RAW_ENV_ADMIN" | jq -r '.VENDEDOR_PASS // empty')
          VENDEDOR_LINE_ID=$(echo "$RAW_ENV_ADMIN" | jq -r '.VENDEDOR_LINE_ID // empty')
          VENDEDOR_CATEGORY_ID=$(echo "$RAW_ENV_ADMIN" | jq -r '.VENDEDOR_CATEGORY_ID // empty')

          # 2. Aplicar enmascaramiento estricto
          echo "::add-mask::$ADMIN_USER"
          echo "::add-mask::$ADMIN_PASS"
          echo "::add-mask::$BACKEND_BASE_URL"
          echo "::add-mask::$VENDEDOR_USER"
          echo "::add-mask::$VENDEDOR_PASS"

          # 3. Eliminar el secreto en crudo de la memoria local
          unset RAW_ENV_ADMIN

          # 4. Crear el archivo .env en la raíz de la colección Bruno
          # Bruno CLI carga process.env desde este archivo, no desde el shell.
          # trap garantiza la eliminación del archivo incluso si los tests fallan.
          trap 'rm -f bruno/.env' EXIT
          printf 'BACKEND_BASE_URL=%s\nADMIN_USER=%s\nADMIN_PASS=%s\nADMIN_LINE_ID=%s\nADMIN_CATEGORY_ID=%s\nVENDEDOR_USER=%s\nVENDEDOR_PASS=%s\nVENDEDOR_LINE_ID=%s\nVENDEDOR_CATEGORY_ID=%s\n' \
            "$BACKEND_BASE_URL" "$ADMIN_USER" "$ADMIN_PASS" \
            "$ADMIN_LINE_ID" "$ADMIN_CATEGORY_ID" \
            "$VENDEDOR_USER" "$VENDEDOR_PASS" \
            "$VENDEDOR_LINE_ID" "$VENDEDOR_CATEGORY_ID" \
            > bruno/.env

          # 5. Ejecutar las colecciones
          cd bruno
          bru run "01 - Auth" "02 - Clientes" "03 - Articulos" --env admin
          bru run "04 - Rol Vendedor" --env vendedor

          # 6. Eliminar el archivo .env del disco al terminar
          cd ..
          rm -f bruno/.env


  playwright-tests:
    name: Playwright frontend tests
    runs-on: ubuntu-latest
    environment: BRUNO_TEST

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Load Secrets and Run Playwright Tests
        env:
          RAW_ENV_ADMIN: ${{ secrets.ENV_ADMIN }}
        run: |
          # 1. Extraer todas las variables requeridas por Playwright y global-setup.js
          FRONTEND_BASE_URL=$(echo "$RAW_ENV_ADMIN" | jq -r '.FRONTEND_BASE_URL // empty')
          ADMIN_USER=$(echo "$RAW_ENV_ADMIN" | jq -r '.ADMIN_USER // empty')
          ADMIN_PASS=$(echo "$RAW_ENV_ADMIN" | jq -r '.ADMIN_PASS // empty')
          VENDEDOR_USER=$(echo "$RAW_ENV_ADMIN" | jq -r '.VENDEDOR_USER // empty')
          VENDEDOR_PASS=$(echo "$RAW_ENV_ADMIN" | jq -r '.VENDEDOR_PASS // empty')

          # 2. Aplicar enmascaramiento estricto
          echo "::add-mask::$FRONTEND_BASE_URL"
          echo "::add-mask::$ADMIN_USER"
          echo "::add-mask::$ADMIN_PASS"
          echo "::add-mask::$VENDEDOR_USER"
          echo "::add-mask::$VENDEDOR_PASS"

          # 3. Eliminar el secreto en crudo
          unset RAW_ENV_ADMIN

          # 4. Crear el archivo .env en la raíz del proyecto
          # playwright.config.js lo carga con dotenv.config(), igual que en local.
          # trap garantiza la eliminación incluso si los tests fallan.
          trap 'rm -f .env' EXIT
          printf 'FRONTEND_BASE_URL=%s\nADMIN_USER=%s\nADMIN_PASS=%s\nVENDEDOR_USER=%s\nVENDEDOR_PASS=%s\nIMCOARCA_ALLOW_WRITES=1\n' \
            "$FRONTEND_BASE_URL" "$ADMIN_USER" "$ADMIN_PASS" \
            "$VENDEDOR_USER" "$VENDEDOR_PASS" \
            > .env

          # 5. Ejecutar los tests
          npx playwright test


      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30