name: CI Playwright/Bruno Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  bruno-tests:
    name: Bruno backend API tests
    runs-on: ubuntu-latest
    environment: BRUNO_TEST
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Install Bruno CLI
        run: npm install -g @usebruno/cli

      - name: Load Secrets and Run Bruno Tests
        env:
          RAW_ENV_ADMIN: ${{ secrets.ENV_ADMIN }}
        run: |
          # 1. Extraer y enmascarar inmediatamente las variables para que GitHub Actions las censure en todos los logs
          ADMIN_USER=$(echo "$RAW_ENV_ADMIN" | jq -r '.ADMIN_USER // empty')
          ADMIN_PASS=$(echo "$RAW_ENV_ADMIN" | jq -r '.ADMIN_PASS // empty')
          
          echo "::add-mask::$ADMIN_USER"
          echo "::add-mask::$ADMIN_PASS"
          
          # Exportar para los siguientes comandos dentro del mismo step
          export ADMIN_USER
          export ADMIN_PASS
          
          # 2. Desarmar la variable JSON original para evitar filtraciones accidentales
          unset RAW_ENV_ADMIN
          
          # 3. Navegar al directorio de la colección y ejecutar Bruno
          cd bruno
          bru run "01 - Auth" "02 - Clientes" "03 - Articulos" --env admin
          bru run "04 - Rol Vendedor" --env vendedor

  playwright-tests:
    name: Playwright frontend tests
    runs-on: ubuntu-latest
    environment: BRUNO_TEST

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Load Secrets and Run Playwright Tests
        env:
          RAW_ENV_ADMIN: ${{ secrets.ENV_ADMIN }}
        run: |
          # Extraer y aplicar enmascaramiento estricto
          FRONTEND_BASE_URL=$(echo "$RAW_ENV_ADMIN" | jq -r '.FRONTEND_BASE_URL // empty')
          echo "::add-mask::$FRONTEND_BASE_URL"
          export FRONTEND_BASE_URL
          
          unset RAW_ENV_ADMIN
          
          IMCOARCA_ALLOW_WRITES=1 npx playwright test


      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30