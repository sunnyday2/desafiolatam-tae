name: Playwright/Bruno Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  playwright:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
    
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      # MANTIENES ESTO PARA PLAYWRIGHT
      - name: Crear .env desde los GitHub Secrets
        working-directory: ${{ github.workspace }}
        run: |
            cat > .env <<EOF
            BASE_URL=${{ secrets.BASE_URL || 'https://admin.leonardojose.dev' }}
            ADMIN_USER=${{ secrets.ADMIN_USER }}
            ADMIN_PASS=${{ secrets.ADMIN_PASS }}
            VENDEDOR_USER=${{ secrets.VENDEDOR_USER }}
            VENDEDOR_PASS=${{ secrets.VENDEDOR_PASS }}
            EOF

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  bruno:
    name: Bruno API tests
    runs-on: ubuntu-latest
    environment: bruno_test
    timeout-minutes: 15
    # VARIABLES GLOBALES DEL JOB (Inyectadas directamente a process.env)
    env:
      BASE_URL: ${{ secrets.BASE_URL }}
      ADMIN_USER: ${{ secrets.ADMIN_USER }}
      ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
      ADMIN_LINE_ID: ${{ secrets.ADMIN_LINE_ID }}
      ADMIN_CATEGORY_ID: ${{ secrets.ADMIN_CATEGORY_ID }}
      VENDEDOR_USER: ${{ secrets.VENDEDOR_USER }}
      VENDEDOR_PASS: ${{ secrets.VENDEDOR_PASS }}
      VENDEDOR_LINE_ID: ${{ secrets.VENDEDOR_LINE_ID }}
      VENDEDOR_CATEGORY_ID: ${{ secrets.VENDEDOR_CATEGORY_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Bruno CLI
        run: npm install -g @usebruno/cli

      - name: Run Bruno API tests (admin env)
        run: bru run "01 - Auth" "02 - Clientes" "03 - Articulos" --env admin

      - name: Run Bruno API tests (vendedor env)
        run: bru run "04 - Rol Vendedor" --env vendedor