name: CI Playwright/Bruno Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  bruno-tests:
    name: Bruno backend API tests
    runs-on: ubuntu-latest
    environment: BRUNO_TEST
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Install Bruno CLI
        run: npm install -g @usebruno/cli

      - name: Load Secrets and Run Bruno Tests
        env:
          RAW_ENV_ADMIN: ${{ secrets.ENV_ADMIN }}
        run: |
          # 1. Extraer todas las variables requeridas desde el JSON de secretos
          ADMIN_USER=$(echo "$RAW_ENV_ADMIN" | jq -r '.ADMIN_USER // empty')
          ADMIN_PASS=$(echo "$RAW_ENV_ADMIN" | jq -r '.ADMIN_PASS // empty')
          BACKEND_BASE_URL=$(echo "$RAW_ENV_ADMIN" | jq -r '.BACKEND_BASE_URL // empty')
          ADMIN_LINE_ID=$(echo "$RAW_ENV_ADMIN" | jq -r '.ADMIN_LINE_ID // empty')
          ADMIN_CATEGORY_ID=$(echo "$RAW_ENV_ADMIN" | jq -r '.ADMIN_CATEGORY_ID // empty')
          VENDEDOR_USER=$(echo "$RAW_ENV_ADMIN" | jq -r '.VENDEDOR_USER // empty')
          VENDEDOR_PASS=$(echo "$RAW_ENV_ADMIN" | jq -r '.VENDEDOR_PASS // empty')
          VENDEDOR_LINE_ID=$(echo "$RAW_ENV_ADMIN" | jq -r '.VENDEDOR_LINE_ID // empty')
          VENDEDOR_CATEGORY_ID=$(echo "$RAW_ENV_ADMIN" | jq -r '.VENDEDOR_CATEGORY_ID // empty')

          # 2. Aplicar enmascaramiento estricto
          echo "::add-mask::$ADMIN_USER"
          echo "::add-mask::$ADMIN_PASS"
          echo "::add-mask::$BACKEND_BASE_URL"
          echo "::add-mask::$VENDEDOR_USER"
          echo "::add-mask::$VENDEDOR_PASS"

          # 3. Exportar variables de entorno para que el proceso hijo (Bruno) las lea
          export ADMIN_USER
          export ADMIN_PASS
          export BACKEND_BASE_URL
          export ADMIN_LINE_ID
          export ADMIN_CATEGORY_ID
          export VENDEDOR_USER
          export VENDEDOR_PASS
          export VENDEDOR_LINE_ID
          export VENDEDOR_CATEGORY_ID

          # 4. Eliminar el secreto en crudo de la memoria local
          unset RAW_ENV_ADMIN

          # 5. Ejecutar las colecciones
          cd bruno
          bru run "01 - Auth" "02 - Clientes" "03 - Articulos" --env admin --env-var BACKEND_BASE_URL="$BACKEND_BASE_URL"
          bru run "04 - Rol Vendedor" --env vendedor --env-var BACKEND_BASE_URL="$BACKEND_BASE_URL"


  playwright-tests:
    name: Playwright frontend tests
    runs-on: ubuntu-latest
    environment: BRUNO_TEST

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Load Secrets and Run Playwright Tests
        env:
          RAW_ENV_ADMIN: ${{ secrets.ENV_ADMIN }}
        run: |
          # 1. Extraer todas las variables requeridas por Playwright y global-setup.js
          FRONTEND_BASE_URL=$(echo "$RAW_ENV_ADMIN" | jq -r '.FRONTEND_BASE_URL // empty')
          ADMIN_USER=$(echo "$RAW_ENV_ADMIN" | jq -r '.ADMIN_USER // empty')
          ADMIN_PASS=$(echo "$RAW_ENV_ADMIN" | jq -r '.ADMIN_PASS // empty')
          VENDEDOR_USER=$(echo "$RAW_ENV_ADMIN" | jq -r '.VENDEDOR_USER // empty')
          VENDEDOR_PASS=$(echo "$RAW_ENV_ADMIN" | jq -r '.VENDEDOR_PASS // empty')

          # 2. Aplicar enmascaramiento estricto
          echo "::add-mask::$FRONTEND_BASE_URL"
          echo "::add-mask::$ADMIN_USER"
          echo "::add-mask::$ADMIN_PASS"
          echo "::add-mask::$VENDEDOR_USER"
          echo "::add-mask::$VENDEDOR_PASS"

          # 3. Exportar variables para que el proceso de Node/Playwright las lea
          export FRONTEND_BASE_URL
          export ADMIN_USER
          export ADMIN_PASS
          export VENDEDOR_USER
          export VENDEDOR_PASS

          # 4. Eliminar el secreto en crudo
          unset RAW_ENV_ADMIN

          # 5. Ejecutar los tests
          IMCOARCA_ALLOW_WRITES=1 npx playwright test


      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30